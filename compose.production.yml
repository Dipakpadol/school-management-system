name: school-erp

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - db_net


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: school-erp-backend:latest
    restart: unless-stopped

    environment:
      SERVER_PORT: "8080"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_PROFILES_ACTIVE: prod
      APP_MASTER_DATA_SEED_ENABLED: ${APP_MASTER_DATA_SEED_ENABLED:-false}

      # PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-school-erp}
      JWT_AUDIENCES: ${JWT_AUDIENCES:-school-erp-api}

      # CORS
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS is required}

      # Bootstrap admin
      BOOTSTRAP_SUPER_ADMIN_ENABLED: ${BOOTSTRAP_SUPER_ADMIN_ENABLED:-false}
      BOOTSTRAP_SUPER_ADMIN_EMAIL: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:-}
      BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}
      BOOTSTRAP_SUPER_ADMIN_FIRST_NAME: ${BOOTSTRAP_SUPER_ADMIN_FIRST_NAME:-Super}
      BOOTSTRAP_SUPER_ADMIN_LAST_NAME: ${BOOTSTRAP_SUPER_ADMIN_LAST_NAME:-Admin}

      # Mail
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      NOTIFICATIONS_EMAIL_FROM: ${NOTIFICATIONS_EMAIL_FROM:-}

      # Java
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx768m}

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8080/api/actuator/health/readiness"
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

    networks:
      - app_net
      - db_net


  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile

      args:
        FLUTTER_CHANNEL: ${FLUTTER_CHANNEL:-stable}
        API_BASE_URL: /api

    image: school-erp-nginx:latest
    restart: unless-stopped

    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?NGINX_SERVER_NAME is required}
      LETSENCRYPT_DOMAIN: ${DOMAIN:?DOMAIN is required}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot

    depends_on:
      backend:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - |
        while :; do
          sleep 6h
          render-nginx-conf
          nginx -s reload
        done &
        render-nginx-conf
        nginx -g 'daemon off;'

    networks:
      - app_net


  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot

    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot

    networks:
      - app_net


  certbot-renew:
    image: certbot/certbot:latest
    restart: unless-stopped

    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot

    entrypoint: /bin/sh

    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 12h
        done

    networks:
      - app_net


volumes:
  postgres-data:
  letsencrypt:
  certbot-www:


networks:
  app_net:
    driver: bridge

  db_net:
    driver: bridge
    internal: true
