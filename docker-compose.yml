services:
  postgres:
    image: postgres:16-alpine
    container_name: school-erp-postgres
    environment:
      POSTGRES_DB: school_erp
      POSTGRES_USER: school_erp
      POSTGRES_PASSWORD: school_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_erp -d school_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
