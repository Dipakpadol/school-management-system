server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: school-erp-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/school_erp}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  master-data:
    seed:
      enabled: ${APP_MASTER_DATA_SEED_ENABLED:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
  security:
    auth:
      max-failed-login-attempts: ${AUTH_MAX_FAILED_LOGIN_ATTEMPTS:5}
      lock-duration: ${AUTH_LOCK_DURATION:15m}
    bootstrap-super-admin:
      enabled: ${BOOTSTRAP_SUPER_ADMIN_ENABLED:false}
      email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
      first-name: ${BOOTSTRAP_SUPER_ADMIN_FIRST_NAME:Super}
      last-name: ${BOOTSTRAP_SUPER_ADMIN_LAST_NAME:Admin}
    jwt:
      issuer: ${JWT_ISSUER:school-erp}
      audiences: ${JWT_AUDIENCES:school-erp-api}
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
      password-reset-token-ttl: ${JWT_PASSWORD_RESET_TOKEN_TTL:30m}
