server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: school-erp-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/school_erp_one}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:dipakpadol0@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:oyriqzikuvrrpaug}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  master-data:
    seed:
      enabled: ${APP_MASTER_DATA_SEED_ENABLED:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
  security:
    auth:
      max-failed-login-attempts: ${AUTH_MAX_FAILED_LOGIN_ATTEMPTS:5}
      lock-duration: ${AUTH_LOCK_DURATION:15m}
      signup-default-role: ${AUTH_SIGNUP_DEFAULT_ROLE:PARENT}
      signup-default-status: ${AUTH_SIGNUP_DEFAULT_STATUS:ACTIVE}
    bootstrap-super-admin:
      enabled: ${BOOTSTRAP_SUPER_ADMIN_ENABLED:false}
      email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
      first-name: ${BOOTSTRAP_SUPER_ADMIN_FIRST_NAME:Super}
      last-name: ${BOOTSTRAP_SUPER_ADMIN_LAST_NAME:Admin}
    jwt:
      issuer: ${JWT_ISSUER:school-erp}
      audiences: ${JWT_AUDIENCES:school-erp-api}
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:60m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
      password-reset-token-ttl: ${JWT_PASSWORD_RESET_TOKEN_TTL:30m}

school:
  public-site:
    name: ${SCHOOL_PUBLIC_SITE_NAME:Star International School}
    enquiry-email: ${SCHOOL_PUBLIC_SITE_ENQUIRY_EMAIL:info@starinternationalschool.com}

notifications:
  school-name: ${NOTIFICATIONS_SCHOOL_NAME:School ERP}
  scheduler:
    enabled: ${NOTIFICATIONS_SCHEDULER_ENABLED:true}
    fee-due-cron: "${NOTIFICATIONS_FEE_DUE_CRON:0 0 9 * * *}"
    fee-overdue-cron: "${NOTIFICATIONS_FEE_OVERDUE_CRON:0 30 9 * * *}"
    absence-cron: "${NOTIFICATIONS_ABSENCE_CRON:0 0 17 * * *}"
    exam-reminder-cron: "${NOTIFICATIONS_EXAM_REMINDER_CRON:0 0 18 * * *}"
    hostel-fee-cron: "${NOTIFICATIONS_HOSTEL_FEE_CRON:0 15 9 * * *}"
    zone: ${NOTIFICATIONS_SCHEDULER_ZONE:Asia/Kolkata}
    email-enabled: ${NOTIFICATIONS_SCHEDULER_EMAIL_ENABLED:true}
    sms-enabled: ${NOTIFICATIONS_SCHEDULER_SMS_ENABLED:false}
    whatsapp-enabled: ${NOTIFICATIONS_SCHEDULER_WHATSAPP_ENABLED:false}
  email:
    enabled: ${NOTIFICATIONS_EMAIL_ENABLED:true}
    provider: ${NOTIFICATIONS_EMAIL_PROVIDER:smtp}
    from: ${NOTIFICATIONS_EMAIL_FROM:}
    console-fallback-enabled: ${NOTIFICATIONS_EMAIL_CONSOLE_FALLBACK_ENABLED:false}
  sms:
    enabled: ${NOTIFICATIONS_SMS_ENABLED:false}
    provider: ${NOTIFICATIONS_SMS_PROVIDER:none}
    api-key: ${NOTIFICATIONS_SMS_API_KEY:}
    sender-id: ${NOTIFICATIONS_SMS_SENDER_ID:}
    template-id: ${NOTIFICATIONS_SMS_TEMPLATE_ID:}
    base-url: ${NOTIFICATIONS_SMS_BASE_URL:}
  whatsapp:
    enabled: ${NOTIFICATIONS_WHATSAPP_ENABLED:false}
    provider: ${NOTIFICATIONS_WHATSAPP_PROVIDER:none}
    api-key: ${NOTIFICATIONS_WHATSAPP_API_KEY:}
    base-url: ${NOTIFICATIONS_WHATSAPP_BASE_URL:}
    sender-number: ${NOTIFICATIONS_WHATSAPP_SENDER_NUMBER:}
