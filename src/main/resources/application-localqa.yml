debug: false

spring:
  datasource:
    url: jdbc:h2:mem:school_erp_localqa;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
    org.springframework: INFO

app:
  security:
    bootstrap-super-admin:
      enabled: false
    jwt:
      issuer: school-erp-localqa
      audiences: school-erp-api
      secret: localqa-secret-localqa-secret-32-bytes
      access-token-ttl: 60m
      refresh-token-ttl: 7d
